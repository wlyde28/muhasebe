name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          EXPO_PUBLIC_API_URL: https://web-theta-seven-73.vercel.app/api/records
          EXPO_PUBLIC_APP_PIN: "1234"

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://web-theta-seven-73.vercel.app/api/records
          EXPO_PUBLIC_APP_PIN: "1234"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhasebe-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
